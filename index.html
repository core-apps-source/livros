<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Leitor Kindle - Páginas de Teste</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="reader-shell" data-theme="light">
      <header class="topbar" aria-label="Controles do leitor">
        <div class="book-meta">
          <span class="book-title">Mecanismos de Defesa e Táticas Ofensivas</span>
          <span class="book-subtitle">Capítulo 9</span>
        </div>

        <nav class="toolbar" aria-label="Preferencias">
          <button class="icon-button" id="decreaseZoom" type="button" aria-label="Diminuir página">A-</button>
          <button class="icon-button" id="increaseZoom" type="button" aria-label="Aumentar página">A+</button>
          <select id="themeSelect" aria-label="Tema do leitor">
            <option value="light">Claro</option>
            <option value="sepia">Sépia</option>
            <option value="dark">Escuro</option>
          </select>
          <select id="fitSelect" aria-label="Ajuste da página">
            <option value="height">Altura</option>
            <option value="width">Largura</option>
          </select>
          <button class="icon-button" id="fullscreenButton" type="button" aria-label="Tela cheia">⛶</button>
        </nav>
      </header>

      <section class="reading-area" aria-label="Página do livro">
        <button class="page-zone page-zone-left" id="prevZone" type="button" aria-label="Página anterior"></button>
        <figure class="page-frame" id="pageFrame">
          <img id="pageImage" src="./assets/p6.jpg" alt="Página 1 do livro de teste" />
        </figure>
        <button class="page-zone page-zone-right" id="nextZone" type="button" aria-label="Próxima página"></button>
      </section>

      <footer class="bottombar">
        <button class="nav-button" id="prevButton" type="button">Anterior</button>
        <div class="progress-wrap">
          <div class="progress-labels">
            <span id="pageLabel">Página 1 de 6</span>
            <span id="percentLabel">17%</span>
          </div>
          <input id="pageSlider" type="range" min="0" value="0" aria-label="Ir para página" />
        </div>
        <button class="nav-button" id="nextButton" type="button">Próxima</button>
      </footer>
    </main>

    <script src="app.js"></script>
  </body>
</html>
